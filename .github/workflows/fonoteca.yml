# ============================================================================
# LA TdG FONOTECA — ARXIU PERMANENT DELS ÀUDIOS DE «DECLARACIONS» (05.11.2026)
# ============================================================================
#
# Cada hora (i a mà, des d'Actions) mira quins àudios han d'entrar a la
# fonoteca i arxiva els que encara no hi són: només els que el publicador ja
# ha difós (07.11.2026: ja no se n'afegeixen a mà des de la pàgina).
# Cada àudio es baixa del disc dur, es comprimeix per a veu (MP3 mono 48 kbps,
# volum igualat a -16 LUFS) i es desa a la branca «fonoteca»:
#
#   https://latdg.github.io/media/f/<id>.mp3       → cada àudio
#   https://latdg.github.io/media/f/inventari.json  → el que llegeix la pàgina
#
# A diferència de comprimir.yml, aquí NO s'esborra res als 60 dies.
# Fa servir els mateixos secrets que comprimir.yml (MEDIA_SERVER_*).
# ============================================================================

name: Fonoteca

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fonoteca-latdg
  cancel-in-progress: false

env:
  FONOTECA_KBPS: 48
  FONOTECA_MAX_MINUTS: 300

jobs:
  fonoteca:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          path: codi

      - name: Carregar la fonoteca i els fitxers del publicador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git clone -q --depth 1 --branch fonoteca "$REPO_URL" fono 2>/dev/null; then
            echo "Branca fonoteca carregada."
          else
            mkdir -p fono/f
            git -C fono init -q -b fonoteca
            git -C fono remote add origin "$REPO_URL"
            echo "Primera execució: es crea la branca fonoteca."
          fi
          git clone -q --depth 1 --branch fitxers "$REPO_URL" lloc 2>/dev/null || mkdir -p lloc

      - name: Instal·lar ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null

      - name: Arxivar els àudios nous
        id: arxiu
        env:
          MEDIA_SERVER_BASE: ${{ secrets.MEDIA_SERVER_BASE }}
          MEDIA_SERVER_USER: ${{ secrets.MEDIA_SERVER_USER }}
          MEDIA_SERVER_PASSWORD: ${{ secrets.MEDIA_SERVER_PASSWORD }}
          FONOTECA_SORTIDA: fono/f
          FONOTECA_REGISTRE: lloc/registre.tsv
        run: |
          python3 codi/fonoteca.py | tee -a "$GITHUB_STEP_SUMMARY"
          cd fono
          git config user.name "La TdG fonoteca"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "canvis=0" >> "$GITHUB_OUTPUT"
            echo "Cap canvi a la fonoteca."
          else
            git commit -q -m "Fonoteca: $(date +%d.%m.%Y)"
            git push -q origin HEAD:fonoteca
            echo "canvis=1" >> "$GITHUB_OUTPUT"
          fi

      # La web de latdg/media és una de sola: fitxers del publicador + fonoteca.
      - name: Muntar la web
        if: ${{ steps.arxiu.outputs.canvis == '1' || github.event_name == 'workflow_dispatch' }}
        run: |
          rm -rf lloc/.git lloc/f
          cp -r fono/f lloc/f

      - uses: actions/configure-pages@v5
        if: ${{ steps.arxiu.outputs.canvis == '1' || github.event_name == 'workflow_dispatch' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.arxiu.outputs.canvis == '1' || github.event_name == 'workflow_dispatch' }}
        with:
          path: lloc

      - uses: actions/deploy-pages@v4
        if: ${{ steps.arxiu.outputs.canvis == '1' || github.event_name == 'workflow_dispatch' }}
